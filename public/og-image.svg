<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient background glow blobs -->
  <circle cx="200" cy="150" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="450" r="220" fill="#db2777" opacity="0.2" filter="url(#glow)" />

  <!-- Grid decoration overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(100, 85)">
    <rect width="280" height="42" rx="21" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e0e7ff">
      100% Client-Side WebAssembly
    </text>
  </g>

  <!-- Brand Name -->
  <g transform="translate(100, 190)">
    <rect width="64" height="64" rx="16" fill="url(#badgeGrad)" />
    <text x="32" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
    <text x="86" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Code<tspan fill="#818cf8">Space</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
    Fast, Free Online Compiler &amp; IDE
  </text>
  <text x="100" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Zero server queues • Run Python 3.12, C, C++, Java &amp; JS directly in your browser.
  </text>

  <!-- Language Badges Row -->
  <g transform="translate(100, 390)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="170" height="58" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="22" fill="#38bdf8">🐍 Python 3.12</text>
    </g>
    <!-- C -->
    <g transform="translate(186, 0)">
      <rect width="130" height="58" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="22" fill="#60a5fa">⚡ C (Clang)</text>
    </g>
    <!-- C++ -->
    <g transform="translate(332, 0)">
      <rect width="140" height="58" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="22" fill="#818cf8">🚀 C++ 20</text>
    </g>
    <!-- Java -->
    <g transform="translate(488, 0)">
      <rect width="130" height="58" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="22" fill="#f97316">☕ Java 17</text>
    </g>
    <!-- JS -->
    <g transform="translate(634, 0)">
      <rect width="160" height="58" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="22" fill="#facc15">🟨 JavaScript</text>
    </g>
  </g>

  <!-- Bottom Feature Highlights -->
  <g transform="translate(100, 520)">
    <g transform="translate(0, 0)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#34d399">✓ 0ms Server Wait</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Client-side execution</text>
    </g>
    <g transform="translate(260, 0)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">✓ 100% Private</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Code never leaves device</text>
    </g>
    <g transform="translate(520, 0)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a78bfa">✓ Interactive Stdin</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Live prompt input</text>
    </g>
    <g transform="translate(780, 0)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f43f5e">✓ Free Forever</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">No signup required</text>
    </g>
  </g>
</svg>
