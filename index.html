    <!-- JSON-LD Structured Data: FAQPage (Google Rich FAQ Snippets) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is CodeSpace online compiler free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! CodeSpace is 100% free with unlimited runs, zero queue times, and no sign-up or credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "How does CodeSpace run code without a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CodeSpace uses WebAssembly (WASM) to compile and execute programs client-side inside your browser web workers. Python executes via Pyodide CPython 3.12, C and C++ compile with Clang WebAssembly, Java runs via a sandboxed WebAssembly JVM, and JavaScript executes in an isolated V8 worker sandbox."
          }
        },
        {
          "@type": "Question",
          "name": "Is my code secure and private on CodeSpace?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Because CodeSpace compiles and runs code entirely inside your browser sandbox, your code is never transmitted to, inspected by, or stored on remote execution servers."
          }
        },
        {
          "@type": "Question",
          "name": "Does CodeSpace support interactive stdin user input?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! CodeSpace provides an integrated terminal with live input continuation. You can provide inputs to Python input(), C scanf(), C++ cin, and Java Scanner prompts seamlessly."
          }
        },
        {
          "@type": "Question",
          "name": "Which programming languages can I compile on CodeSpace?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CodeSpace natively supports Python 3.12, C (Clang 22), C++20 (Clang++), Java 17, and modern JavaScript (ES2024)."
          }
        }
      ]
    }
    </script>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('codespace_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
